      <path d="M207 146 H252 L268 117 L298 152 L324 98 L352 140 H394"/>
      <path d="M457 143 H492 L516 107 L542 154 L575 122 L612 142 H650"/>
      <path d="M707 145 H746 L764 128 L792 103 L826 153 L858 120 L900 145"/>
