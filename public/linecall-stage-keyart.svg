      <rect x="438" y="73" width="230" height="102" rx="4" fill="#0b1113" stroke="#3d4a4e"/>
      <rect x="688" y="73" width="230" height="102" rx="4" fill="#0b1113" stroke="#3d4a4e"/>
      <rect x="938" y="73" width="230" height="102" rx="4" fill="#0b1113" stroke="#3d4a4e"/>
