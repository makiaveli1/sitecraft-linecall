<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Abstract live production stage and control desk</title>
  <desc id="desc">A cinematic dark stage with lime and amber light beams, a distant audience, and a foreground production console.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06090a"/>
      <stop offset="0.58" stop-color="#0b1011"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101719"/>
      <stop offset="0.5" stop-color="#1b2325"/>
      <stop offset="1" stop-color="#101719"/>
    </linearGradient>
    <linearGradient id="beamLime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caff4a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#caff4a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182125" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#090d0f" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="37%" r="58%">
      <stop offset="0" stop-color="#dfffa2" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#8ea960" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a9b5b8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="800" cy="365" rx="690" ry="370" fill="url(#haze)"/>

  <g opacity="0.9">
    <path d="M250 70 L610 620 L430 620 Z" fill="url(#beamLime)" filter="url(#blur10)"/>
    <path d="M1360 56 L986 626 L1174 626 Z" fill="url(#beamAmber)" filter="url(#blur10)"/>
    <path d="M650 48 L762 640 L690 640 Z" fill="url(#beamAmber)" opacity="0.66"/>
    <path d="M980 40 L868 640 L944 640 Z" fill="url(#beamLime)" opacity="0.56"/>
  </g>

  <g stroke="#546064" stroke-width="2" opacity="0.48">
    <path d="M120 156 H1480"/>
    <path d="M170 214 H1430"/>
    <path d="M210 156 L276 214 M1390 156 L1324 214"/>
    <path d="M360 156 L416 214 M1240 156 L1184 214"/>
