name: Deploy LINECALL to here.now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/here-now-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact LINECALL production bundle
        run: npm run build

      - name: Verify exact expected bundle shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const expected = new Map([
            ['index.html', 1366],
            ['assets/index-Biwm6Odh.css', 107291],
            ['assets/index-DGhrTz8S.js', 263058],
            ['linecall-authority-keyart.svg', 5587],
          ]);

          const found = [];
          function walk(dir, prefix = '') {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs, rel);
              else found.push(rel);
            }
          }
          walk('dist');
          found.sort();

          const expectedPaths = [...expected.keys()].sort();
          if (JSON.stringify(found) !== JSON.stringify(expectedPaths)) {
            console.error('Unexpected dist file set:', found);
            process.exit(1);
          }

          for (const [rel, expectedSize] of expected) {
            const data = fs.readFileSync(path.join('dist', rel));
            if (data.length !== expectedSize) {
              console.error(`${rel}: expected ${expectedSize} bytes, got ${data.length}`);
              process.exit(1);
            }
            const sha256 = crypto.createHash('sha256').update(data).digest('hex');
            console.log(`BUNDLE_SHA256 ${rel} ${sha256}`);
          }
          NODE

      - name: Update claimed LINECALL site on here.now
        shell: bash
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          LINECALL_SITE_SLUG: grassy-lotus-7dr8
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/linecall-update.json /tmp/linecall-publish.json' EXIT

          if [[ -z "${HERENOW_API_KEY:-}" ]]; then
            echo 'Missing HERENOW_API_KEY GitHub secret. Refusing to create a replacement anonymous site.' >&2
            echo 'Add the API key from the here.now dashboard as the repository secret HERENOW_API_KEY, then rerun this workflow.' >&2
            exit 2
          fi

          cat > /tmp/linecall-publish.json <<'JSON'
          {
            "displayName": "LINECALL",
            "displayDescription": "LINECALL helps live-event teams keep a show on time while an AI agent explores safe timing fixes and the human operator keeps final authority.",
            "spaMode": true,
            "files": [
              {"path":"index.html","size":1366,"contentType":"text/html; charset=utf-8"},
              {"path":"assets/index-Biwm6Odh.css","size":107291,"contentType":"text/css; charset=utf-8"},
              {"path":"assets/index-DGhrTz8S.js","size":263058,"contentType":"text/javascript; charset=utf-8"},
              {"path":"linecall-authority-keyart.svg","size":5587,"contentType":"image/svg+xml"}
            ]
          }
          JSON

          update_json="$(curl -fsS -X PUT "https://here.now/api/v1/publish/${LINECALL_SITE_SLUG}" \
            -H "Authorization: Bearer ${HERENOW_API_KEY}" \
            -H 'X-HereNow-Client: github-actions/linecall' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/linecall-publish.json)"
          printf '%s' "$update_json" > /tmp/linecall-update.json

          site_url="$(node -e "const r=require('/tmp/linecall-update.json'); if(!r.siteUrl) process.exit(2); process.stdout.write(r.siteUrl)")"
          version_id="$(node -e "const r=require('/tmp/linecall-update.json'); if(!r.upload?.versionId) process.exit(2); process.stdout.write(r.upload.versionId)")"
          finalize_url="$(node -e "const r=require('/tmp/linecall-update.json'); if(!r.upload?.finalizeUrl) process.exit(2); process.stdout.write(r.upload.finalizeUrl)")"

          while IFS='|' read -r rel content_type; do
            upload_url="$(node -e "const r=require('/tmp/linecall-update.json'); const p=process.argv[1]; const u=r.upload?.uploads?.find(x=>x.path===p); if(!u?.url) process.exit(2); process.stdout.write(u.url)" "$rel")"
            curl -fsS -X PUT "$upload_url" \
              -H "Content-Type: $content_type" \
              --data-binary "@dist/$rel" >/dev/null
          done <<'FILES'
          index.html|text/html; charset=utf-8
          assets/index-Biwm6Odh.css|text/css; charset=utf-8
          assets/index-DGhrTz8S.js|text/javascript; charset=utf-8
          linecall-authority-keyart.svg|image/svg+xml
          FILES

          finalize_json="$(curl -fsS -X POST "$finalize_url" \
            -H "Authorization: Bearer ${HERENOW_API_KEY}" \
            -H 'content-type: application/json' \
            --data-binary "{\"versionId\":\"$version_id\"}")"

          state="$(node -e "const r=JSON.parse(process.argv[1]); process.stdout.write(r.publishStatus?.state || '')" "$finalize_json")"
          persistence="$(node -e "const r=JSON.parse(process.argv[1]); process.stdout.write(r.publishStatus?.persistence || '')" "$finalize_json")"
          if [[ "$state" != "live" ]]; then
            echo "here.now finalize did not report live state" >&2
            exit 1
          fi
          if [[ "$persistence" != "permanent" ]]; then
            echo "here.now did not confirm permanent ownership after claimed-site update: $persistence" >&2
            exit 1
          fi

          expected_site="https://${LINECALL_SITE_SLUG}.here.now/"
          if [[ "$site_url" != "$expected_site" ]]; then
            echo "here.now returned unexpected site URL: $site_url" >&2
            exit 1
          fi

          echo "LINECALL_SITE_URL=$site_url"
          echo "LINECALL_FINALIZE_STATE=$state"
          echo "LINECALL_FINALIZE_PERSISTENCE=$persistence"

          {
            echo '### LINECALL here.now deployment receipt'
            echo "- Site: $site_url"
            echo "- Deployment mode: owned-site update"
            echo "- Finalize state: $state"
            echo "- Persistence: $persistence"
            echo "- Source SHA: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p /tmp/linecall-receipt
          node - "$site_url" "$state" "$persistence" "$LINECALL_SITE_SLUG" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [siteUrl, finalizeState, persistence, siteSlug, sourceSha] = process.argv.slice(2);
          fs.writeFileSync('/tmp/linecall-receipt/here-now-receipt.json', JSON.stringify({
            schemaVersion: 2,
            deploymentMode: 'owned-update',
            siteSlug,
            siteUrl,
            finalizeState,
            persistence,
            sourceSha,
            generatedAt: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: linecall-here-now-receipt
          path: /tmp/linecall-receipt/here-now-receipt.json
          retention-days: 1
          if-no-files-found: error

  record-receipt:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download deployment receipt
        uses: actions/download-artifact@v5
        with:
          name: linecall-here-now-receipt
          path: ${{ runner.temp }}/linecall-receipt

      - name: Commit deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deployment
          cp "$RUNNER_TEMP/linecall-receipt/here-now-receipt.json" .deployment/here-now-receipt.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deployment/here-now-receipt.json

          if git diff --cached --quiet; then
            echo 'Deployment receipt already matches current main.'
            exit 0
          fi

          git commit -m 'Record here.now deployment receipt'
          git push origin HEAD:main
